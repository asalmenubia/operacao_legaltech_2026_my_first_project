name: Validate project
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: legaltech_test
          POSTGRES_PASSWORD: temporary-ci-only
          POSTGRES_DB: legaltech_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U legaltech_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://legaltech_test:temporary-ci-only@localhost:5432/legaltech_test
      ISOLATED_TEST_DATABASE: 'true'
      COMMUNICATIONS_LIVE_SEND: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Install report fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-liberation
      - name: Run complete release pipeline
        run: uv run python -m src.pipeline
      - run: uv run python -m tests.integration_communications
      - name: Check communications migration reversibility in the disposable database
        run: |
          uv run python -m alembic downgrade 0003
          uv run python -m alembic upgrade head
          uv run python -m tests.integration_communications
      - name: Upload validated release bundle
        uses: actions/upload-artifact@v4
        with:
          name: legaltech-release
          path: |
            site/
            output/validation/database_validation.json
            output/pipeline/manifest.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
      - name: Preserve pipeline status on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-failure-status
          path: output/pipeline/manifest.json
          if-no-files-found: ignore
  deploy:
    needs: tests
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_GITHUB_PAGES == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: legaltech-release
          path: release
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/site
      - name: Deploy the exact validated site
        id: deployment
        uses: actions/deploy-pages@v4
